<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1e5a7a">
<title>ESTG Promotion 2025/2026 · Results</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  :root {
    --sod: #1e5a7a;
    --sod-dark: #124b66;
    --elt: #b3541e;
    --elt-dark: #8d3f12;
    --ink: #0b2b3f;
    --muted: #5b7f93;
    --line: #d5e3ed;
    --soft: #f0f7fc;
  }

  html, body { height: 100%; }

  body {
    font-family: 'Inter', -apple-system, 'Segoe UI', system-ui, sans-serif;
    background: linear-gradient(160deg, #f6f9fc 0%, #e6eff7 100%);
    color: var(--ink);
    min-height: 100vh;
    padding: 0.9rem;
    padding-top: max(0.9rem, env(safe-area-inset-top));
    padding-bottom: max(0.9rem, env(safe-area-inset-bottom));
    -webkit-font-smoothing: antialiased;
  }

  .container {
    width: 100%;
    max-width: 1000px;
    margin: 0 auto;
  }

  /* ---------- HEADER ---------- */
  header {
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-radius: 1.5rem;
    padding: 1.1rem 1.2rem;
    box-shadow: 0 14px 30px -18px rgba(0,20,30,0.3);
    border: 1px solid rgba(255,255,255,0.7);
    margin-bottom: 1rem;
    text-align: center;
  }

  h1 {
    font-size: 1.15rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.3;
  }

  h1 .accent {
    background: linear-gradient(90deg, var(--sod), var(--elt));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  header p {
    margin-top: 0.35rem;
    font-size: 0.78rem;
    color: var(--muted);
    letter-spacing: 0.01em;
  }

  /* ---------- TABS ---------- */
  .tabs {
    display: flex;
    gap: 0.4rem;
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    padding: 0.4rem;
    border-radius: 1.2rem;
    box-shadow: 0 10px 24px -18px rgba(0,20,30,0.35);
    border: 1px solid rgba(255,255,255,0.7);
    margin-bottom: 1rem;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }

  .tab {
    flex: 1 0 auto;
    min-width: 90px;
    border: none;
    background: transparent;
    border-radius: 0.95rem;
    padding: 0.75rem 1rem;
    font-family: inherit;
    font-size: 0.82rem;
    font-weight: 700;
    letter-spacing: 0.01em;
    color: var(--muted);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.4rem;
    transition: background 0.18s, color 0.18s, transform 0.12s;
    white-space: nowrap;
    position: relative;
  }

  .tab .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: currentColor; opacity: 0.6;
    flex-shrink: 0;
  }
  .tab .tab-count {
    font-size: 0.68rem;
    font-weight: 600;
    background: rgba(0,0,0,0.06);
    padding: 0.08rem 0.4rem;
    border-radius: 20px;
  }

  .tab:active { transform: scale(0.97); }

  .tab.active {
    background: var(--sod);
    color: #fff;
    box-shadow: 0 8px 18px -8px rgba(30,90,122,0.7);
  }
  .tab.active .tab-count {
    background: rgba(255,255,255,0.22);
    color: #fff;
  }
  .tab[data-target="elt"].active {
    background: var(--elt);
    box-shadow: 0 8px 18px -8px rgba(179,84,30,0.7);
  }
  .tab[data-target="all"].active {
    background: linear-gradient(90deg, var(--sod), var(--elt));
    box-shadow: 0 8px 18px -8px rgba(30,90,122,0.6);
  }

  /* ---------- PANELS ---------- */
  .panel { display: none; animation: fade 0.22s ease; }
  .panel.active { display: block; }

  @keyframes fade {
    from { opacity: 0; transform: translateY(4px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ---------- SECTION ---------- */
  .section {
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-radius: 1.5rem;
    padding: 0.9rem 0.9rem 0.6rem;
    box-shadow: 0 14px 30px -20px rgba(0,20,30,0.35);
    border: 1px solid rgba(255,255,255,0.7);
    margin-bottom: 1rem;
  }

  .section-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.6rem;
    flex-wrap: wrap;
    padding: 0.15rem 0.3rem 0.7rem;
    border-bottom: 1px dashed #c9dceb;
    margin-bottom: 0.6rem;
  }

  .section-title {
    display: flex; align-items: center; gap: 0.55rem;
    font-size: 1rem; font-weight: 700;
    letter-spacing: -0.01em;
  }

  .badge {
    font-size: 0.65rem;
    font-weight: 700;
    padding: 0.28rem 0.65rem;
    border-radius: 40px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #fff;
  }
  .badge-sod { background: var(--sod); }
  .badge-elt { background: var(--elt); }

  .section-meta {
    font-size: 0.72rem;
    color: var(--muted);
    font-family: 'Fira Mono', ui-monospace, monospace;
  }

  /* ---------- TABLE ---------- */
  .table-wrapper {
    background: #fff;
    border-radius: 1rem;
    overflow: hidden;
    border: 1px solid var(--line);
    max-height: 65vh;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }

  table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }

  thead th {
    background: var(--soft);
    color: #174b64;
    font-weight: 700;
    font-size: 0.66rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding: 0.65rem 0.75rem;
    text-align: left;
    border-bottom: 2px solid #bbd4e4;
    white-space: nowrap;
    position: sticky; top: 0; z-index: 2;
  }

  tbody td {
    padding: 0.6rem 0.75rem;
    border-bottom: 1px solid #e9f2f8;
    vertical-align: middle;
  }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:active { background: #f2f9ff; }

  .idx {
    font-weight: 700;
    color: #688ea3;
    width: 42px;
    font-variant-numeric: tabular-nums;
  }

  .sid {
    font-family: 'Fira Mono', ui-monospace, monospace;
    font-weight: 600;
    color: #16455c;
    font-size: 0.72rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 1px;   /* forces ellipsis when needed */
  }

  .open-link {
    display: inline-flex;
    align-items: center;
    gap: 0.3rem;
    font-size: 0.7rem;
    font-weight: 700;
    padding: 0.4rem 0.85rem;
    border-radius: 30px;
    text-decoration: none;
    color: #fff;
    white-space: nowrap;
    transition: background 0.15s, transform 0.1s;
    min-height: 32px;
  }
  .open-link:active { transform: scale(0.95); }
  .open-link.sod { background: var(--sod); }
  .open-link.sod:hover { background: var(--sod-dark); }
  .open-link.elt { background: var(--elt); }
  .open-link.elt:hover { background: var(--elt-dark); }

  /* Column widths: keep Open link narrow on mobile */
  col.col-idx { width: 44px; }
  col.col-open { width: 92px; }

  /* ---------- FOOTER ---------- */
  footer {
    text-align: center;
    font-size: 0.7rem;
    color: var(--muted);
    padding: 0.5rem 0 0.25rem;
    letter-spacing: 0.01em;
  }

  /* ---------- RESPONSIVE TWEAKS ---------- */
  @media (max-width: 480px) {
    body { padding: 0.7rem; }
    header { padding: 0.95rem 0.9rem; border-radius: 1.25rem; }
    h1 { font-size: 1.02rem; }
    header p { font-size: 0.7rem; }
    .tabs { padding: 0.32rem; border-radius: 1rem; gap: 0.3rem; }
    .tab { padding: 0.65rem 0.75rem; font-size: 0.75rem; min-width: 78px; }
    .tab .tab-count { display: none; }   /* save space on tiny screens */
    .section { padding: 0.7rem 0.65rem 0.4rem; border-radius: 1.25rem; }
    .section-title { font-size: 0.9rem; }
    .section-meta { font-size: 0.65rem; }
    .table-wrapper { max-height: 70vh; border-radius: 0.8rem; }
    table { font-size: 0.76rem; }
    thead th { padding: 0.55rem 0.55rem; font-size: 0.6rem; }
    tbody td { padding: 0.5rem 0.55rem; }
    .sid { font-size: 0.65rem; }
    .open-link { padding: 0.35rem 0.7rem; font-size: 0.66rem; min-height: 30px; }
    col.col-open { width: 80px; }
  }

  /* Slightly larger screens: bigger tap targets */
  @media (min-width: 481px) and (max-width: 768px) {
    h1 { font-size: 1.25rem; }
    .tab { padding: 0.8rem 1.1rem; font-size: 0.85rem; }
  }
</style>
</head>
<body>
<div class="container">

  <header>
    <h1>ESTG Promotion <span class="accent">2025/2026</span></h1>
    <p>RNE SDMS · Results by trade</p>
  </header>

  <!-- TABS -->
  <nav class="tabs" role="tablist" aria-label="Trades">
    <button class="tab active" role="tab" data-target="all" aria-selected="true">
      <span class="dot"></span> All <span class="tab-count">137</span>
    </button>
    <button class="tab" role="tab" data-target="sod" aria-selected="false">
      Software Dev <span class="tab-count">77</span>
    </button>
    <button class="tab" role="tab" data-target="elt" aria-selected="false">
      Electrical Tech <span class="tab-count">60</span>
    </button>
  </nav>

  <!-- PANEL: ALL -->
  <div class="panel active" id="panel-all" role="tabpanel">
    <section class="section" id="section-sod-all"></section>
    <section class="section" id="section-elt-all"></section>
  </div>

  <!-- PANEL: SOD ONLY -->
  <div class="panel" id="panel-sod" role="tabpanel">
    <section class="section" id="section-sod"></section>
  </div>

  <!-- PANEL: ELT ONLY -->
  <div class="panel" id="panel-elt" role="tabpanel">
    <section class="section" id="section-elt"></section>
  </div>

  <footer>All links open in a new tab · hosted static page</footer>

</div>

<script>
  // ---------------- CONFIG ----------------
  const PREFIX = "330415";
  const YEAR = "2026";

  const TRADES = [
    { code: "SOD", name: "Software Development",    badge: "sod", start: 1, end: 77, linkClass: "sod" },
    { code: "ELT", name: "Electrical Technology",   badge: "elt", start: 1, end: 60, linkClass: "elt" }
  ];

  // ---------------- HELPERS ----------------
  function buildSectionHtml(trade) {
    const rows = [];
    for (let n = trade.start; n <= trade.end; n++) {
      const padded = n.toString().padStart(3, "0");
      const id = `${PREFIX}${trade.code}${padded}${YEAR}`;
      const url = `https://rne.sdms.gov.rw/results/${id}`;
      rows.push(`
        <tr>
          <td class="idx">${n}</td>
          <td class="sid" title="${id}">${id}</td>
          <td><a class="open-link ${trade.linkClass}" href="${url}" target="_blank" rel="noopener noreferrer">↗ Open</a></td>
        </tr>`);
    }

    const firstId = `${PREFIX}${trade.code}${String(trade.start).padStart(3,"0")}${YEAR}`;
    const lastId  = `${PREFIX}${trade.code}${String(trade.end).padStart(3,"0")}${YEAR}`;

    return `
      <div class="section-head">
        <div class="section-title">
          ${trade.name}
          <span class="badge badge-${trade.badge}">${trade.code}</span>
        </div>
        <div class="section-meta">${trade.end - trade.start + 1} students · ${firstId} → ${lastId}</div>
      </div>
      <div class="table-wrapper">
        <table>
          <colgroup>
            <col class="col-idx">
            <col>
            <col class="col-open">
          </colgroup>
          <thead>
            <tr><th>#</th><th>Student ID</th><th>Result</th></tr>
          </thead>
          <tbody>${rows.join("")}</tbody>
        </table>
      </div>`;
  }

  function renderSection(targetId, trade) {
    const el = document.getElementById(targetId);
    if (el) el.innerHTML = buildSectionHtml(trade);
  }

  // ---------------- BUILD ----------------
  const [SOD, ELT] = TRADES;

  // All tab → both sections stacked
  renderSection("section-sod-all", SOD);
  renderSection("section-elt-all", ELT);

  // Individual tabs
  renderSection("section-sod", SOD);
  renderSection("section-elt", ELT);

  // ---------------- TAB LOGIC ----------------
  const tabs = document.querySelectorAll(".tab");
  const panels = document.querySelectorAll(".panel");

  function activateTab(target) {
    tabs.forEach(t => {
      const on = t.dataset.target === target;
      t.classList.toggle("active", on);
      t.setAttribute("aria-selected", on ? "true" : "false");
    });
    panels.forEach(p => {
      p.classList.toggle("active", p.id === `panel-${target}`);
    });
    // reset scroll position when switching tabs
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  tabs.forEach(t => {
    t.addEventListener("click", () => activateTab(t.dataset.target));
  });

  // keyboard arrow navigation between tabs
  document.querySelector(".tabs").addEventListener("keydown", (e) => {
    const idx = Array.from(tabs).findIndex(t => t.classList.contains("active"));
    if (e.key === "ArrowRight") {
      const next = tabs[(idx + 1) % tabs.length];
      next.focus(); activateTab(next.dataset.target);
    } else if (e.key === "ArrowLeft") {
      const prev = tabs[(idx - 1 + tabs.length) % tabs.length];
      prev.focus(); activateTab(prev.dataset.target);
    }
  });
</script>
</body>
</html>
